# Tool settings only: the project runs from source, it is not installed as a package (see requirements.txt).

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors, pyflakes, bugbear, import order
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.mypy]
files = ["slowest_link", "experiments"]
strict = true

[[tool.mypy.overrides]]
module = ["relate", "relate.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra lists every skip and expected failure with its reason; --strict-markers refuses a misspelt marker.
# pytest-randomly shuffles the order on every run (replay a run with --randomly-seed=<seed> or
# --randomly-seed=last); pytest-timeout fails any test that runs past `timeout` seconds.
addopts = "-m 'not live and not e2e' -ra --strict-markers"
timeout = 30
xfail_strict = true
# Unmarked tests are unit tests. Mark the others so the split can be counted (see tests.yml).
markers = [
    "integration: the project's own parts together, through an entry point (HTTP route, CLI, tool wrapper)",
    "e2e: the real UI in a browser",
    "live: calls a real service with real keys; skipped unless run with -m live",
]

[tool.coverage.run]
source = ["slowest_link"]
branch = true

[tool.coverage.report]
# The decision core: the modules whose rules decide every finding, test outcome and guard verdict. The README
# publishes this figure as "decision core coverage". The CLI, the MCP server and the text reports are tested through
# their entry points (tests marked integration) and are not part of this figure.
include = [
    "*/slowest_link/checks.py",
    "*/slowest_link/evidence.py",
    "*/slowest_link/export.py",
    "*/slowest_link/guard.py",
    "*/slowest_link/scoring.py",
    "*/slowest_link/seed.py",
    "*/slowest_link/store.py",
    "*/slowest_link/traces.py",
    "*/slowest_link/whatif.py",
]
fail_under = 90
show_missing = true

[tool.codespell]
skip = "*.png,*.jpg,*.gif,*.svg,*.lock,*.gz,*.jsonl,package-lock.json,.git,.venv,node_modules,./experiments/people.json"
