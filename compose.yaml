# docker compose up web          the browser page   http://localhost:8080
# docker compose run --rm cli    the checks on the committed plan (add a command: explain "View cart", whatif "...")
services:
  web:
    build:
      context: .
      target: web
    image: "slowest-link:web"
    ports:
      - "127.0.0.1:8080:8080"

  cli:
    build:
      context: .
      target: cli
    image: "slowest-link:cli"
    profiles: ["cli"]
