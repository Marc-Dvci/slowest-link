# On a pull request that changes the plan: fail when the change breaks a recovery promise or makes one worse.
# Read-only: nothing here writes to the repository.
name: plan guard
on:
  pull_request:
    paths: ["plan/**"]
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Promises this change breaks or makes worse
        shell: bash
        run: |
          set +e
          python -m slowest_link guard --base-ref "origin/${{ github.base_ref }}" | tee guard.txt
          status=${PIPESTATUS[0]}
          { echo "### Plan guard"; echo; echo '```'; cat guard.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
