# Publish the browser page (web/) to GitHub Pages on every push to main. It needs nothing else: Relate runs in the
# page, in WebAssembly. Pages deploys need pages: write and id-token: write only; nothing writes to the repository.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The page, its scripts and its data
        run: |
          mkdir site
          cp -r web/index.html web/style.css web/favicon.svg web/og-card.png web/js web/data site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
