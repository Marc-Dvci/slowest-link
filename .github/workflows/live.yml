# A smoke test of the live page during judging, with its own badge. It reads the page and writes nothing to the
# repository. After RESULTS_DATE the job ends at once, so it never turns red later.
name: live
on:
  workflow_dispatch:
  # The schedule is switched on once the page is public:
  # schedule:
  #   - cron: "17 */6 * * *"
permissions:
  contents: read
env:
  LIVE_URL: "https://marc-dvci.github.io/slowest-link"
  RESULTS_DATE: "2026-12-17"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: The live page and its graph answer
        run: |
          if [ "$(date -u +%F)" \> "$RESULTS_DATE" ]; then echo "Past the results date."; exit 0; fi
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$LIVE_URL/" | grep -q '<title>Slowest Link</title>'
          curl -fsS --max-time 90 "$LIVE_URL/data/graph.cypher" | grep -q 'CREATE'
          curl -fsS --max-time 90 "https://cdn.jsdelivr.net/npm/@relate/relate-wasm@1.0.1/relate_bg.wasm" -o /dev/null
