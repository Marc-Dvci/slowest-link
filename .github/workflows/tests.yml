# On every push: lint, format, types, tests with coverage of the decision core, spelling and local links (Python);
# the browser code checked against the command line on Relate's WebAssembly build; the page driven in Chromium with
# an axe-core scan; and both Docker images, started and called.
# Read-only: nothing here writes to the repository.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  DO_NOT_TRACK: "1"
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests in random order, with line and branch coverage of the decision core
        shell: bash
        run: python -m pytest -q --cov --randomly-seed="$GITHUB_RUN_ID" | tee pytest.log
      - name: Summary on the run page
        if: always()
        shell: bash
        run: |
          count() { python -m pytest --collect-only -q -p no:randomly -m "$1" 2>/dev/null | tail -n 1 | grep -Eo '^[0-9]+' || echo 0; }
          {
            echo "### Tests"
            echo
            grep -E "passed|failed" pytest.log | tail -n 1
            echo "Random order: replay it with \`python -m pytest --randomly-seed=$GITHUB_RUN_ID\`."
            echo
            echo "| Kind | Tests |"
            echo "|---|---|"
            echo "| Unit | $(count 'not integration and not e2e and not live') |"
            echo "| Integration | $(count integration) |"
            echo "| End-to-end | $(count e2e) |"
            echo
            echo "### Coverage of the decision core (lines and branches)"
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"
      - run: codespell
      - run: python scripts/check_links.py
      - run: python scripts/check_placeholders.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The browser code gives the command line's answers, on Relate's WebAssembly build
        working-directory: web
        run: |
          npm ci
          node test/parity.mjs | tee parity.log
          { echo "### Browser and command line"; echo; cat parity.log; } >> "$GITHUB_STEP_SUMMARY"
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm ci
        working-directory: web
      - name: The page in Chromium, every section, with an axe-core scan
        shell: bash
        run: |
          python -m pytest -q -m e2e | tee e2e.log
          { echo "### Browser tests"; echo; grep -E "passed|failed" e2e.log | tail -n 1; } >> "$GITHUB_STEP_SUMMARY"
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target cli -t slowest-link:cli .
      - name: The command line runs every check on the committed plan
        run: docker run --rm slowest-link:cli check --as-of 2026-11-14 | tee check.txt && grep -q "Broken promises" check.txt
      - run: docker build --target web -t slowest-link:web .
      - run: docker run -d --name web -p 127.0.0.1:8080:8080 slowest-link:web
      - name: The page and its graph are served
        run: |
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/ > /dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/ | grep -q '<title>Slowest Link</title>'
          curl -fs http://127.0.0.1:8080/data/graph.cypher | grep -q 'CREATE'
      - if: failure()
        run: docker logs web
